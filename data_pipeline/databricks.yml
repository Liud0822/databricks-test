# This is a Declarative Automation Bundle definition for data_pipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: data_pipeline
  uuid: c843979f-3b08-4b0b-a240-618e00b76721

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-a0bafda3-e403.cloud.databricks.com
    variables:
      catalog: dev_catalog
      schema: default
  prod:
    mode: production
    workspace:
      host: https://dbc-a0bafda3-e403.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/liud280479237@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/liud280479237@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod_catalog
      schema: default
    permissions:
      - user_name: liud280479237@gmail.com
        level: CAN_MANAGE
